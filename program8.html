<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tiamat - Multi Character Slider</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px;
    }

    .slider-container {
      width: 100%;
      max-width: 1000px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
      padding: 20px;
    }

    .main-card {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
    }

    .image-section {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .image-section img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    .content-section {
      flex: 1;
      padding: 15px;
    }

    .content-section h1 {
      font-size: 36px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #9ad0ff;
      margin-bottom: 20px;
      font-style: italic;
    }

    .desc {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .stats {
      background: rgba(0,0,0,0.4);
      padding: 15px;
      border-radius: 15px;
    }

    .stats div {
      margin: 8px 0;
    }

    .slider-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
    }

    button {
      background: #9ad0ff;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #c0e4ff;
      transform: scale(1.02);
    }

    .dots {
      display: flex;
      gap: 12px;
    }

    .dot {
      width: 12px;
      height: 12px;
      background: #ccc;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.2s;
    }

    .dot.active {
      background: #9ad0ff;
      transform: scale(1.3);
    }

    @media (max-width: 700px) {
      .main-card {
        flex-direction: column;
      }
      button {
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>

<div class="slider-container">
  <div class="main-card">
    <div class="image-section">
      <img id="slideImage" src="karakter.jpg" alt="Character">
    </div>
    <div class="content-section">
      <h1 id="charName">tiamat</h1>
      <div class="subtitle" id="charSub">Mystical Star-Eyed Entity</div>
      <div class="desc" id="charDesc">
        Karakter ini memiliki penampilan seperti elf dengan telinga runcing
        dan rambut panjang berwarna perak kebiruan. Matanya bersinar dengan
        pola bintang, menunjukkan kekuatan supernatural.
      </div>
      <div class="stats">
        <div><strong>Ras:</strong> <span id="charRace">Elf / Unknown</span></div>
        <div><strong>Kekuatan:</strong> <span id="charPower">Star Energy</span></div>
        <div><strong>Sifat:</strong> <span id="charNature">Calm, Mysterious</span></div>
      </div>
    </div>
  </div>

  <div class="slider-controls">
    <button id="prevBtn">◀ Sebelumnya</button>
    <div class="dots" id="dotsContainer"></div>
    <button id="nextBtn">Selanjutnya ▶</button>
  </div>
</div>

<script>
  // DATA KARAKTER (ini contoh, ganti sesuai punya lu)
  const characters = [
    {
      name: "tiamat",
      subtitle: "Mystical Star-Eyed Entity",
      desc: "Penampilan seperti elf dengan telinga runcing dan rambut panjang perak kebiruan. Matanya bersinar pola bintang, aura lembut misterius.",
      race: "Elf / Unknown",
      power: "Star Energy",
      nature: "Calm, Mysterious",
      image: "karakter.jpg"   // ganti path gambar asli lu
    },
    {
      name: "Tiamat - Eclipse Form",
      subtitle: "Void Star Incarnation",
      desc: "Wujud gelap saat gerhana bintang. Rambut berubah hitam kebiruan dengan kilau ungu, mata bintangnya menyala lebih terang.",
      race: "Ethereal Being",
      power: "Void Star Energy",
      nature: "Mysterious, Dominant",
      image: "karakter2.jpg"
    },
    {
      name: "Tiamat - Dawn Aspect",
      subtitle: "Radiant Star Guardian",
      desc: "Wujud penuh cahaya, rambut berwarna putih keemasan. Kalung kristal mengeluarkan sinar lembut. Sifat lebih hangat dan protektif.",
      race: "Celestial Elf",
      power: "Purified Star Energy",
      nature: "Warm, Protective",
      image: "karakter3.jpg"
    }
  ];

  let currentIndex = 0;

  const imgEl = document.getElementById('slideImage');
  const nameEl = document.getElementById('charName');
  const subEl = document.getElementById('charSub');
  const descEl = document.getElementById('charDesc');
  const raceEl = document.getElementById('charRace');
  const powerEl = document.getElementById('charPower');
  const natureEl = document.getElementById('charNature');

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const dotsContainer = document.getElementById('dotsContainer');

  function updateSlider() {
    const data = characters[currentIndex];
    imgEl.src = data.image;
    imgEl.alt = data.name;
    nameEl.textContent = data.name;
    subEl.textContent = data.subtitle;
    descEl.textContent = data.desc;
    raceEl.textContent = data.race;
    powerEl.textContent = data.power;
    natureEl.textContent = data.nature;

    // update dot active
    document.querySelectorAll('.dot').forEach((dot, idx) => {
      dot.classList.toggle('active', idx === currentIndex);
    });
  }

  function createDots() {
    dotsContainer.innerHTML = '';
    characters.forEach((_, idx) => {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (idx === currentIndex) dot.classList.add('active');
      dot.addEventListener('click', () => {
        currentIndex = idx;
        updateSlider();
      });
      dotsContainer.appendChild(dot);
    });
  }

  prevBtn.addEventListener('click', () => {
    currentIndex = (currentIndex - 1 + characters.length) % characters.length;
    updateSlider();
  });

  nextBtn.addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % characters.length;
    updateSlider();
  });

  createDots();
  updateSlider();
</script>

</body>
</html>
